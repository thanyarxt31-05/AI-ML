<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Linear Regression Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">1. Linear Regression</h1>
                <p class="text-slate-400 text-sm">Supervised Learning • Fitting Line</p>
            </div>
            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm border border-slate-600 font-semibold transition">← กลับหน้าหลัก</a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6">
                <h2 class="text-xl font-semibold border-b border-slate-700 pb-2">Parameter Tuning</h2>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <label>Weight (w)</label>
                        <span id="w-val" class="font-mono text-blue-400">2.0</span>
                    </div>
                    <input type="range" id="w-slider" min="-5" max="5" step="0.1" value="2" class="w-full accent-blue-500">
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <label>Bias (b)</label>
                        <span id="b-val" class="font-mono text-blue-400">10.0</span>
                    </div>
                    <input type="range" id="b-slider" min="-20" max="20" step="1" value="10" class="w-full accent-blue-500">
                </div>
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <label>Noise Level</label>
                        <span id="noise-val" class="font-mono text-blue-400">5.0</span>
                    </div>
                    <input type="range" id="noise-slider" min="0" max="20" step="1" value="5" class="w-full accent-blue-500">
                </div>
                <div class="p-4 bg-slate-900/50 rounded-lg text-xs space-y-2 text-slate-300 border border-slate-700">
                    <p class="font-semibold text-white">สมการ Linear Regression:</p>
                    <p class="font-mono text-center text-yellow-400">y = wx + b</p>
                </div>
            </div>
            <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                <h2 class="text-xl font-semibold mb-4">Regression Plot</h2>
                <div class="relative w-full h-[400px]">
                    <canvas id="chart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script>
        function genData(w, b, noise) {
            const data = [];
            for (let x = 0; x <= 10; x += 0.5) {
                const noiseVal = (Math.random() - 0.5) * noise * 2;
                data.push({ x: x, y: (w * x) + b + noiseVal });
            }
            return data;
        }
        const ctx = document.getElementById('chart').getContext('2d');
        let w = 2.0, b = 10.0, noise = 5.0;
        let points = genData(w, b, noise);

        const chart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [
                    { label: 'Data Points', data: points, backgroundColor: 'rgba(59, 130, 246, 0.7)' },
                    { type: 'line', label: 'Prediction Line', data: [{x: 0, y: b}, {x: 10, y: (w * 10) + b}], borderColor: '#ef4444', borderWidth: 3, fill: false, pointRadius: 0 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: '#334155' } }, y: { grid: { color: '#334155' } } } }
        });

        function update() {
            chart.data.datasets[1].data = [{x: 0, y: b}, {x: 10, y: (w * 10) + b}];
            chart.update();
        }
        document.getElementById('w-slider').addEventListener('input', (e) => { w = parseFloat(e.target.value); document.getElementById('w-val').innerText = w; update(); });
        document.getElementById('b-slider').addEventListener('input', (e) => { b = parseFloat(e.target.value); document.getElementById('b-val').innerText = b; update(); });
        document.getElementById('noise-slider').addEventListener('input', (e) => { noise = parseFloat(e.target.value); document.getElementById('noise-val').innerText = noise; chart.data.datasets[0].data = genData(w, b, noise); update(); });
    </script>
</body>
</html>
